services:
  analyzer-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_analyzer
      POSTGRES_USER: ${ANALYZER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ANALYZER_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${ANALYZER_DB_PORT:-55434}:5432"
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: main-postgres
    restart: on-failure
    ports:
      - "${EWM_DB_HOST_PORT:-55435}:${EWM_DB_CONTAINER_PORT:-5432}"
    environment:
      - POSTGRES_PASSWORD=${EWM_POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${EWM_POSTGRES_USER:-postgres}
      - POSTGRES_DB=${EWM_POSTGRES_DB:-ewm}
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

volumes:
  analyzer-db-data:
