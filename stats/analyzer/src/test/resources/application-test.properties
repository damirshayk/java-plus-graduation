spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
grpc.server.port=-1
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=RECORD
spring.datasource.url=jdbc:h2:mem:analyzer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/analyzer-migration
stats.kafka.topics.user-actions=stats.user-actions.v1
stats.kafka.topics.events-similarity=stats.events-similarity.v1
stats.kafka.retry-backoff-ms=10
stats.recommendations.history-size=2
stats.recommendations.neighbors-size=2
stats.weights.view=0.4
stats.weights.register=0.8
stats.weights.like=1.0
