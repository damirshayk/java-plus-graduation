server:
  port: 0
  forward-headers-strategy: native

spring:
  jackson:
    default-property-inclusion: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:main;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

ewm:
  events:
    min-start-delay-hours: 2

stats:
  service-id: stats-server
