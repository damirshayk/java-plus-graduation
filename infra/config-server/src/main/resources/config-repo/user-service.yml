server:
  port: 0
  forward-headers-strategy: native

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/users;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/user-migration
  sql:
    init:
      mode: never

ewm:
  cleanup:
    topic: ewm.user-data-cleanup.v1
    publisher-enabled: true
    relay-enabled: true
    batch-size: 50
    relay-delay-ms: 1000
    send-timeout-ms: 12000
