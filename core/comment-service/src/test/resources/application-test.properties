spring.datasource.url=jdbc:h2:mem:comments-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/comment-migration
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
ewm.cleanup.listener-enabled=false
spring.kafka.admin.auto-create=false
ewm.cleanup.relay-enabled=false
ewm.cleanup.publisher-enabled=false
